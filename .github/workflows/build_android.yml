name: Build OpenBOR Plus Android

on:
  push:
  pull_request:
  workflow_dispatch: # Mengaktifkan tombol Run Workflow manual

jobs:
  Android:
    name: Android-arm64
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          engine/android/*.gradle
          engine/android/gradle/wrapper/gradle-wrapper.properties
          engine/android/app/*.gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Android packages
      run: sdkmanager "platforms;android-34" "platforms;android-31" "build-tools;36.0.0" "ndk;21.4.7075529"

    - name: Generate version
      working-directory: engine
      run: |
        if [ -f version.sh ]; then bash version.sh; fi

    - name: Build Android ARM64
      working-directory: engine/android
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon clean assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: "OpenBOR_Plus_Android"
        path: engine/android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
